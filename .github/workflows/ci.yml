name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dream-biker-frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time site URL for absolute metadata URLs (no secrets are needed to build)
      NEXT_PUBLIC_SITE_URL: https://dreambiker.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dream-biker-frontend/package-lock.json

      - name: Install dependencies (also runs prisma generate)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
